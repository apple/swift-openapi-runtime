name: Main

permissions:
  contents: read

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 8,20 * * *"

jobs:
  tests:
    name: Tests
    uses: swiftlang/github-workflows/.github/workflows/package_test.yml@0.0.19
    with:
      # Linux and Windows run Swift current-2, current-1, current, nightly-release and nightly-main (the default
      # version lists; the minimum version is auto-detected from Package.swift). Debug-Test replaces the former
      # "Unit tests" jobs and Release-Build the former "Release builds" jobs. The flags are part of the Debug-Test
      # command rather than linux_version_overrides, as the overrides would also apply to Release-Build.
      linux_command: |
        Debug-Test: swift test --explicit-target-dependency-import-check error
        Release-Build: swift build -c release
      windows_command: |
        Debug-Test: swift test --explicit-target-dependency-import-check error
        Release-Build: swift build -c release
      # Run Windows builds in the Swift Windows container images, as the swift-nio workflows did.
      windows_use_docker: true
      macos_runner_pool: nightly
      # The Swift toolchains plus the latest Xcode beta, as the former macOS tests job ran.
      macos_swift_versions: '["current-2", "current-1", "current"]'
      macos_xcode_versions: '["latest-beta"]'
      xcode_scheme: swift-openapi-runtime
      xcode_targets: |
        macOS:
          build: true
        Catalyst:
          build: true
        iOS:
          build: true
        watchOS:
          build: true
        tvOS:
          build: true
        visionOS:
          build: true
      linux_static_sdk_versions: '["current", "nightly-main"]'
      android_sdk_versions: '["nightly-main"]'
      android_sdk_build_triples: '["aarch64-unknown-linux-android28"]'
      android_emulator_test_triples: '[]'
      enable_wasm_sdk_build: false
      enable_embedded_wasm_sdk_build: false
      enable_cxx_interop: false
      enable_macos_swiftly: false
      enable_freebsd: false

  integration-test:
    name: Integration test
    uses: swiftlang/github-workflows/.github/workflows/package_test.yml@0.0.19
    with:
      name: "integration-test"
      linux_swift_versions: '["current-2", "current-1", "current", "nightly-release"]'
      linux_setup_command: "command -v jq >/dev/null || (sudo apt-get update -y && sudo apt-get install -yq jq)"
      linux_command: ./scripts/run-integration-test.sh
      enable_macos: false
      enable_macos_swiftly: false
      enable_windows: false
      enable_linux_static_sdk_build: false
      enable_wasm_sdk_build: false
      enable_embedded_wasm_sdk_build: false
      enable_android_sdk_build: false
      enable_cxx_interop: false
      enable_freebsd: false

  linkage-test:
    name: Linkage test
    uses: swiftlang/github-workflows/.github/workflows/package_test.yml@0.0.19
    with:
      name: "linkage-test"
      linux_swift_versions: '["current-2", "current-1", "current"]'
      linux_command: ./scripts/run-linkage-test.sh
      enable_macos: false
      enable_macos_swiftly: false
      enable_windows: false
      enable_linux_static_sdk_build: false
      enable_wasm_sdk_build: false
      enable_embedded_wasm_sdk_build: false
      enable_android_sdk_build: false
      enable_cxx_interop: false
      enable_freebsd: false
